name: episode
description: "A modern Episode media tracker application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  archive: ^4.0.9
  crypto: ^3.0.7
  uuid: ^4.0.0
  web: ^1.1.1
  xml: ^7.0.1
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.2
  package_info_plus: ^8.1.2
  device_info_plus: ^11.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
